# Audit A-02 (head check) and B-08 (performance budget).
#
# Every PR builds the site, runs lint, types, unit tests and the head check,
# then measures the four baseline URLs against lighthouserc.json. The budget
# is what stops the Sprint 1-3 gains being given back the next time content
# is added.

name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # generate-sitemap.mjs reads each content file's last commit date
          # for <lastmod> (A-03), so a shallow clone would produce wrong dates.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Head check — canonical, title, description, h1, JSON-LD
        run: npm run check:head

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
